name: Build EC AIR

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS (Universal)
    runs-on: macos-15-intel

    steps:
      - name: Checkout con LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Verificar que existe la imagen de fondo
        run: |
          echo "=== Revisando Assets/ ==="
          ls -lh Assets/ || echo "No existe carpeta Assets"
          if [ -f "Assets/EC-Air-Exciter-Background.png" ]; then
            echo "✅ Imagen encontrada"
            file Assets/EC-Air-Exciter-Background.png
            ls -lh Assets/EC-Air-Exciter-Background.png
          else
            echo "⚠️ Imagen NO encontrada - el build seguirá con fondo viejo gracias al parche del CMake"
          fi

      - name: Setup Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Configure CMake
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Listar plugins generados
        run: |
          find build -name "*.vst3" -o -name "*.component" | head -20
          ls -lh build/EC_AIR_artefacts/Release/ || true

      - name: Subir VST3
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EC-AIR-VST3-macOS-Universal
          path: build/EC_AIR_artefacts/Release/VST3/
          if-no-files-found: warn

      - name: Subir AU
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EC-AIR-AU-macOS-Universal
          path: build/EC_AIR_artefacts/Release/AU/
          if-no-files-found: warn

      - name: Subir Standalone
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EC-AIR-Standalone-macOS-Universal
          path: build/EC_AIR_artefacts/Release/Standalone/
          if-no-files-found: warn
