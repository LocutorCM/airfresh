name: Build EC AIR

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS - AU + VST3
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.30.x'

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: ~/JUCE
          key: juce-cache

      - name: Configure - Universal Binary para Logic
        run: |
          cmake -B build \
            -D CMAKE_BUILD_TYPE=Release \
            -D CMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -D CMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Listar lo que se compiló - para ver si sí hizo el AU
        run: |
          echo "=== Buscando .component ==="
          find build -name "*.component" -type d
          echo "=== Buscando .vst3 ==="
          find build -name "*.vst3" -type d
          echo "=== Todo ==="
          ls -R build | head -n 100

      - name: Validar AU con auval
        run: |
          COMPONENT=$(find build -name "*.component" -type d | head -n 1)
          if [ -z "$COMPONENT" ]; then
            echo "❌ ERROR: No se generó ningún .component - El CMake no tiene AU activado"
            exit 1
          fi
          echo "✅ Se generó: $COMPONENT"
          # Quitar quarantine por si acaso
          xattr -cr "$COMPONENT" || true
          # Validar
          auval -a | grep -i EC || echo "auval no lo lista aún, pero el archivo sí existe"

      - name: Subir Artifact - AU para Logic
        uses: actions/upload-artifact@v4
        with:
          name: EC-AIR-macOS-AU-VST3
          path: |
            build/**/*.component
            build/**/*.vst3
          if-no-files-found: error
          retention-days: 30
